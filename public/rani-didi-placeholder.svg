<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241e38" />
      <stop offset="50%" stop-color="#1a162b" />
      <stop offset="100%" stop-color="#120f20" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#f6d9a5" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#e8a8c8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1a162b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d4" />
      <stop offset="50%" stop-color="#f4d499" />
      <stop offset="100%" stop-color="#c9974f" />
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d5e5" />
      <stop offset="100%" stop-color="#c48ba4" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="330" r="230" fill="url(#halo)" />

  <!-- Stars & sparkles -->
  <g fill="#fde8bb" opacity="0.75">
    <circle cx="120" cy="110" r="2.5" />
    <circle cx="480" cy="140" r="3" />
    <circle cx="160" cy="240" r="1.8" />
    <circle cx="450" cy="270" r="2.2" />
    <circle cx="90" cy="380" r="2" />
    <circle cx="510" cy="420" r="2" />
    <path d="M200 120 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" fill="#fde8bb" />
    <path d="M420 180 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#fff3d1" />
    <path d="M140 450 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#fde8bb" />
  </g>

  <!-- Decorative Orbit ring -->
  <ellipse cx="300" cy="330" rx="190" ry="70" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.45" transform="rotate(-18 300 330)" />

  <!-- Mother & Baby Silhouette Art -->
  <g transform="translate(195, 170)">
    <!-- Mother silhouette -->
    <path d="M105,75 C95,50 120,25 145,35 C160,42 165,60 160,78 C155,95 140,110 135,125 C145,130 170,145 185,175 C195,198 200,240 195,280 C190,310 150,320 100,320 C50,320 20,310 15,280 C10,240 25,190 55,160 C70,145 90,135 95,120 C90,105 85,90 105,75 Z" fill="url(#rose)" opacity="0.88" />
    
    <!-- Hair detail / grace -->
    <path d="M100,60 C90,80 80,120 75,160 C85,145 95,115 108,95 Z" fill="#6d4c6d" opacity="0.6" />

    <!-- Baby nestled in arms -->
    <path d="M65,180 C60,165 75,150 90,155 C100,160 102,175 98,185 C92,198 80,210 70,215 C60,205 58,190 65,180 Z" fill="url(#gold)" />
    <!-- Swaddle -->
    <path d="M55,195 C70,190 110,195 120,225 C125,245 105,270 80,265 C60,260 48,230 55,195 Z" fill="#ffffff" opacity="0.8" />
    
    <!-- Heart glow -->
    <path d="M105,150 C105,145 112,140 118,145 C125,140 132,145 132,150 C132,160 118,170 118,170 C118,170 105,160 105,150 Z" fill="#ff7da7" />
  </g>

  <!-- Elegant frame caption inside placeholder -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">
    <text x="300" y="580" fill="url(#gold)" font-size="19" font-weight="600" letter-spacing="3">RANI DIDI &amp; BHANJI</text>
    <text x="300" y="612" fill="#c7bed3" font-size="12" letter-spacing="1">Click &quot;Add Photo&quot; to choose her picture</text>
  </g>
</svg>
